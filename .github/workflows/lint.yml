# lint — four gates:
#   1. gitleaks     : scan full history for leaked secrets (every push)
#   2. shellcheck   : every sh/bash script in the repo (shebang-aware — some
#                     restored 2016 scripts are ruby and are only parsed)
#   3. smoke        : run the real bootstrap in an isolated fake $HOME and
#                     assert the linking conventions, zsh syntax, tmux config
#   4. linux-smoke  : the full userland install as a NON-ROOT user in
#                     rockylinux:9 / ubuntu:24.04 containers — the real
#                     acceptance test for the local/ layer (paths filter +
#                     weekly: it downloads the ~2 GB LLVM tarball)
#
# No template-rendering job: this repo has no templates. What you see in a
# topic file is exactly what lands in $HOME.

name: lint

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly, upstream pins can rot (assets move)

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the latest commit
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      # Direct CLI scan of the whole history. The gitleaks-action wrapper
      # computes a base..HEAD range that breaks on a repository's root commit
      # (base^ does not exist) — a plain full scan has no such edge case.
      - name: gitleaks (full history)
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck every sh/bash script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            shebang="$(head -n1 "$f")"
            case "$shebang" in
              *sh)
                echo "shellcheck: $f"
                shellcheck "$f" || fail=1
                ;;
              *)
                echo "skip (non-shell): $f"
                ;;
            esac
          done < <(find . -type f -not -path './.git/*' -print0)
          exit "$fail"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh + tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh tmux
      - name: Bootstrap dry-run in an isolated HOME
        run: |
          set -euo pipefail
          mkdir -p /tmp/fakehome
          env -u XDG_CONFIG_HOME HOME=/tmp/fakehome ./script/bootstrap --dry-run
          # dry-run must not have touched anything
          [ -z "$(find /tmp/fakehome -mindepth 1)" ] && echo "dry-run: touched nothing"
      - name: Bootstrap for real and assert the linking conventions
        run: |
          set -euo pipefail
          env -u XDG_CONFIG_HOME HOME=/tmp/fakehome ./script/bootstrap --force
          src="$PWD"
          check() { # check <readlink-output> <expected-src> <label>
            [ "$1" = "$2" ] && echo "OK  $3" || { echo "FAIL $3: $1"; exit 1; }
          }
          check "$(readlink /tmp/fakehome/.gitconfig)" "$src/git/gitconfig.symlink" "R1 gitconfig"
          [ -e /tmp/fakehome/.zshrc ] && echo "OK  R1 zshrc" || { echo "FAIL zshrc"; exit 1; }
          [ -e /tmp/fakehome/.tmux.conf ] && echo "OK  R1 tmux" || { echo "FAIL tmux"; exit 1; }
          [ -e /tmp/fakehome/.config/starship.toml ] && echo "OK  R2 starship" || { echo "FAIL starship"; exit 1; }
          [ -d /tmp/fakehome/.config/nvim ] && echo "OK  R2 nvim dir" || { echo "FAIL nvim"; exit 1; }
          # R4: darwin-only files must NOT be linked on a linux runner
          [ ! -e /tmp/fakehome/.zprofile ] && echo "OK  R4 (no .zprofile on linux)" || { echo "FAIL .zprofile leaked"; exit 1; }
      - name: Idempotence — second run links nothing new
        run: |
          set -euo pipefail
          out="$(env -u XDG_CONFIG_HOME HOME=/tmp/fakehome ./script/bootstrap)"
          echo "$out"
          echo "$out" | grep -q "0 linked" || { echo "FAIL: not idempotent"; exit 1; }
      - name: zsh syntax — every topic file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            zsh -n "$f" || fail=1
          done < <(find . -name '*.zsh' -not -path './.git/*' | sort)
          [ -e /tmp/fakehome/.zshrc ] && zsh -n /tmp/fakehome/.zshrc
          exit "$fail"
      - name: tmux config loads
        run: |
          set -euo pipefail
          tmux -L ci -f /tmp/fakehome/.tmux.conf new-session -d
          tmux -L ci kill-server
          echo "tmux: config loaded clean"

  # The layer engine, proven on a fixture layer end to end in a scratch
  # HOME: registry, --root linking, install walker, guards. No private data
  # anywhere near it — script/tests/layers-fixture is the layer.
  layers-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixture layer end to end in a scratch HOME
        run: |
          set -euo pipefail
          export TESTHOME="$(mktemp -d)"
          export HOME="$TESTHOME"
          export XDG_CONFIG_HOME="$TESTHOME/.config"
          tmp="$(mktemp -d)"
          cp -R script/tests/layers-fixture "$tmp/fixture"
          git -C "$tmp/fixture" init -q && git -C "$tmp/fixture" add -A
          git -C "$tmp/fixture" -c user.email=ci@invalid -c user.name=ci commit -qm fixture

          ./script/layers add "$tmp/fixture"
          ./script/layers list | grep -q '^\[1\] fixture'
          ./script/layers paths | grep -qx "$tmp/fixture"

          ./script/bootstrap --root "$tmp/fixture" --dry-run | grep -q '^LINK'
          [ ! -e "$TESTHOME/.homedot" ] # dry-run touched nothing
          ./script/bootstrap --root "$tmp/fixture" --force
          readlink "$TESTHOME/.homedot" | grep -q 'fixture/fixture/homedot\.symlink$'
          ./script/bootstrap --root "$tmp/fixture" | grep -q '0 linked' # idempotent

          ./script/install --root "$tmp/fixture" | grep -q 'fixture: install.sh ran'

          # audit: disjoint by construction, must be silent and green
          ./script/audit

          # doctor: the layer's check.sh hook runs under the layer prefix
          ./script/doctor | grep -q '\[fixture\] ok: fixture'

          # audit: a colliding layer must be reported
          cp -R "$tmp/fixture" "$tmp/other"
          printf '{"contract": 1, "name": "other"}\n' > "$tmp/other/layer.json"
          git -C "$tmp/other" add -A
          git -C "$tmp/other" -c user.email=ci@invalid -c user.name=ci commit -qm other
          ./script/layers add "$tmp/other" >/dev/null
          # audit exits 1 by design when it reports violations — capture first
          collisions="$(./script/audit || true)"
          printf '%s\n' "$collisions" | grep -q '\[fixture\].*\[other\].*homedot' \
            || { echo "FAIL: collision not reported"; exit 1; }
          ./script/layers remove other >/dev/null

          mkdir -p "$tmp/notalayer"
          if ./script/bootstrap --root "$tmp/notalayer" >/dev/null 2>&1; then
            echo "FAIL: --root accepted a directory without layer.json"; exit 1
          fi
          if ./script/layers add "$tmp/fixture" >/dev/null 2>&1; then
            echo "FAIL: duplicate layer registration accepted"; exit 1
          fi
          ./script/layers remove fixture
          [ ! -s "$TESTHOME/.config/dotfiles/layers" ]
          echo "layers-smoke: OK"
      - name: adopt merge regression suite (7 cases)
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          bash script/tests/adopt-merge.bash

  # The acceptance test for the local/ layer: the complete userland install
  # as a non-root user, on the two distro families we care about, plus a
  # compiler-less leg proving the WARN-and-continue contract (that leg also
  # skips LLVM — nothing would use it without a compiler anyway).
  # The runner checks out; the distro runs via docker with the repo mounted
  # read-only (container-jobs would need Node >= 20 inside each image for
  # actions/checkout). The same command runs locally:
  #   docker run --rm -v "$HOME/.dotfiles:/src:ro" rockylinux:9 \
  #     bash /src/.github/ci/linux-smoke.sh
  linux-smoke:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "rockylinux:9" # the RHEL 9 target, closest free proxy
            with_compiler: "yes"
          - image: "ubuntu:24.04" # doubles as the WSL proxy
            with_compiler: "yes"
          - image: "rockylinux:9"
            with_compiler: "no" # no gcc/make: builds must WARN, not fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Userland install in ${{ matrix.image }} as a non-root user
        run: |
          set -euo pipefail
          full="rg fd bat eza fzf zoxide delta duf dust jq shellcheck starship \
                ccache ninja cmake clang clang++ clangd clang-format clang-tidy nvim zsh tmux"
          tarballs="rg fd bat eza fzf zoxide delta duf dust jq shellcheck starship \
                ccache ninja cmake nvim"
          if [ "${{ matrix.with_compiler }}" = yes ]; then assert="$full"; else assert="$tarballs"; fi
          docker run --rm \
            -v "$PWD:/src:ro" \
            -e WITH_COMPILER="${{ matrix.with_compiler }}" \
            -e ASSERT_TOOLS="$assert" \
            "${{ matrix.image }}" \
            bash /src/.github/ci/linux-smoke.sh
